    <style>
        table {
            width: 100%;
            table-layout: fixed;
            
        }


        table td,
        table th {
            overflow-wrap: break-word;
            word-break: break-all;
            white-space: normal;
        }
    </style>

</head>

<body>
    <div class="header">
        <h2>Admin Dashboard</h2>
        <div class="avatar">
            <img src="https://cdn.pixabay.com/photo/2023/10/03/10/39/ai-generated-8291190_640.png" alt="">

    </div>
    <div class="sidebar">
        <a href="./index.html">🏠Home</a>

                </div>
                <div class="col col-lg-2">
                    <button class="btn btn-danger" id="catBtn">Add Category</button>
                    <button class="btn btn-danger d-none" id="uptBtn">Update Category</button>

            <table id="cat">
                <tr id="loading">
